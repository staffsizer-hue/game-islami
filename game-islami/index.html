<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Islamic Game Zone</title>
  
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- GOOGLE ADSENSE SCRIPT -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1564785063766835"
     crossorigin="anonymous"></script>

  <style>
    .ad-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .ad-modal-content {
      background: #ffffff;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      color: #333;
    }
    .ad-modal-content h3 { margin-top: 0; color: #2c3e50; }
    .ad-container {
      min-height: 250px;
      margin: 15px 0;
      background: #f9f9f9;
      border: 1px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-download-final {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    .btn-download-final:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- KONTEN UTAMA GAME -->
  <div id="app"></div>

  <!-- MODAL POP-UP IKLAN SERTIFIKAT -->
  <div id="adCertificateModal" class="ad-modal-overlay">
    <div class="ad-modal-content">
      <h3>📜 Menyiapkan Sertifikat</h3>
      <p id="adTimerText">Sertifikat Anda siap dalam <b>5</b> detik...</p>
      
      <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block; width:100%; height:250px;"
             data-ad-client="ca-pub-1564785063766835"
             data-ad-slot="auto"
             data-ad-format="rectangle"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>

      <button id="btnDownloadNow" class="btn-download-final" disabled>
        Mohon Tunggu...
      </button>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    function triggerDownloadWithAd(callbackDownload) {
      const modal = document.getElementById('adCertificateModal');
      const timerText = document.getElementById('adTimerText');
      const btnDownload = document.getElementById('btnDownloadNow');
      
      let timeLeft = 5;
      modal.style.display = 'flex';
      btnDownload.disabled = true;
      btnDownload.innerText = 'Mohon Tunggu...';

      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerText.innerHTML = `Sertifikat Anda siap dalam <b>${timeLeft}</b> detik...`;
        } else {
          clearInterval(countdown);
          timerText.innerHTML = "✨ Sertifikat Anda sudah siap!";
          btnDownload.disabled = false;
          btnDownload.innerText = "Unduh Sertifikat Sekarang";
        }
      }, 1000);

      btnDownload.onclick = function() {
        modal.style.display = 'none';
        if (typeof callbackDownload === 'function') {
          callbackDownload();
        }
      };
    }
  </script>
</body>
</html>
